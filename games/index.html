<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>🎰 Casino Games | Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0b0f1c 0%, #1a1f33 50%, #0a0d1a 100%);
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      position: relative;
      overflow-x: hidden;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Balance Bar */
    .balance-bar {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 1000;
      background: linear-gradient(135deg, #1e1625, #0a0a0a);
      border: 2px solid #b49450;
      border-radius: 0 0 0 20px;
      padding: 10px 20px;
      color: #ffd966;
      font-weight: bold;
      font-size: 1rem;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6), inset 0 1px 10px rgba(255,215,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
    }

    .balance-bar .balance-amount {
      font-size: 1.2rem;
      color: #f5e56c;
      text-shadow: 0 0 10px #ffb703;
      min-width: 60px;
      text-align: right;
    }

    .balance-bar .user-id {
      font-size: 0.65rem;
      color: #b49450;
      border-left: 1px solid #b49450;
      padding-left: 8px;
      margin-left: 5px;
      white-space: nowrap;
    }

    /* Menu Page */
    .menu-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 80px 15px 30px;
    }

    .menu-card {
      background: radial-gradient(circle at 20% 20%, #3a2c41, #1e1324);
      border-radius: 30px;
      padding: 40px 30px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.7), inset 0 5px 15px rgba(255,215,0,0.3), 0 0 40px #b8860b80;
      border: 2px solid #d4af37;
      text-align: center;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .menu-title {
      color: #ffd700;
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 0 0 30px #ffb703, 0 0 60px #ffaa00;
      margin-bottom: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: titleGlow 2s infinite alternate;
    }

    @keyframes titleGlow {
      from { text-shadow: 0 0 20px #ffb703, 0 0 40px #ffaa00; }
      to { text-shadow: 0 0 40px #ffd700, 0 0 80px #ff7700, 0 0 100px #ff5500; }
    }

    .menu-subtitle {
      color: #f8e3a0;
      font-size: 1.1rem;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .game-card {
      background: linear-gradient(135deg, #2a1f35, #1e1625);
      border-radius: 20px;
      padding: 25px 20px;
      border: 2px solid #b49450;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 20px #ffb70366;
      border-color: #ffd966;
    }

    .game-card:active {
      transform: translateY(0);
    }

    .game-icon {
      font-size: 3.5rem;
      animation: iconBounce 2s infinite;
    }

    @keyframes iconBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .game-name {
      color: #ffd966;
      font-size: 1.3rem;
      font-weight: bold;
      text-shadow: 0 0 10px #ffb703;
    }

    .game-desc {
      color: #b49450;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .coming-soon {
      opacity: 0.5;
      cursor: not-allowed;
      position: relative;
    }

    .coming-soon::after {
      content: "COMING SOON";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      background: #ffaa00;
      color: #1e0f1a;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .coming-soon .game-icon,
    .coming-soon .game-name,
    .coming-soon .game-desc {
      filter: blur(2px);
    }

    @media (max-width: 480px) {
      .balance-bar {
        padding: 6px 12px;
        font-size: 0.8rem;
        border-radius: 0 0 0 15px;
        gap: 5px;
      }
      .balance-bar .balance-amount {
        font-size: 0.9rem;
        min-width: 45px;
      }
      .balance-bar .user-id {
        font-size: 0.55rem;
        padding-left: 5px;
        margin-left: 3px;
      }
      .menu-page {
        padding: 70px 10px 20px;
      }
      .menu-title {
        font-size: 1.8rem;
      }
      .menu-card {
        padding: 25px 15px;
      }
      .games-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .game-icon {
        font-size: 2.5rem;
      }
      .game-name {
        font-size: 1.1rem;
      }
    }

    @media (min-width: 768px) {
      .menu-title {
        font-size: 3.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Balance Bar -->
  <div class="balance-bar" id="balanceBar">
    💰 <span>Balance:</span>
    <span class="balance-amount" id="globalBalanceDisplay">3000</span>
    <span class="user-id" id="userIdDisplay"></span>
  </div>

  <!-- Menu Page -->
  <div class="menu-page">
    <div class="menu-card">
      <div class="menu-title">🎰 Casino Games</div>
      <div class="menu-subtitle">Choose your game and test your luck!</div>
      
      <div class="games-grid">
        <!-- Fortune Reels -->
        <a href="fortune-reels.html" class="game-card">
          <div class="game-icon">🎰</div>
          <div class="game-name">Fortune Reels</div>
          <div class="game-desc">Classic slot machine with fireworks and music</div>
        </a>

        <!-- Coming Soon Game -->
        <div class="game-card coming-soon">
          <div class="game-icon">🃏</div>
          <div class="game-name">Blackjack Pro</div>
          <div class="game-desc">Coming in next update</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============ COOKIE MANAGEMENT ============
      function setCookie(name, value, days = 365) {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Lax';
      }

      function getCookie(name) {
        return document.cookie.split('; ').reduce((r, v) => {
          const parts = v.split('=');
          return parts[0] === name ? decodeURIComponent(parts[1]) : r;
        }, '');
      }

      // ============ USER IDENTIFICATION ============
      function generateUserId() {
        return 'USER-' + Math.random().toString(36).substr(2, 9).toUpperCase();
      }

      function getUserId() {
        let userId = getCookie('fortuneUserId');
        if (!userId) {
          userId = generateUserId();
          setCookie('fortuneUserId', userId);
        }
        return userId;
      }

      // ============ BALANCE MANAGEMENT ============
      function getBalance() {
        const balance = getCookie('fortuneBalance');
        return balance ? parseInt(balance) : 3000;
      }

      function saveBalance(amount) {
        setCookie('fortuneBalance', amount.toString());
      }

      // ============ INITIALIZATION ============
      const userId = getUserId();
      let balance = getBalance();
      saveBalance(balance);

      document.getElementById('globalBalanceDisplay').textContent = balance;
      document.getElementById('userIdDisplay').textContent = userId;

      // Update balance every second (in case it was changed in game)
      setInterval(() => {
        balance = getBalance();
        document.getElementById('globalBalanceDisplay').textContent = balance;
      }, 1000);
    })();
  </script>
</body>
</html>
